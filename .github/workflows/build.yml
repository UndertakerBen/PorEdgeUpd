name: Build and test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build "Portable Edge (Chromium) Updater.sln" -c Debug
      - run: dotnet run --project tests/PortableEdge.Tests
      - run: dotnet run --project tests/PortableEdge.Tests --no-build -- --ui-smoke "$pwd"
